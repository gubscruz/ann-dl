site_name: gubscruz · Redes Neurais
site_author: gubscruz
site_description: Portfólio de exercícios e projetos de Redes Neurais e Deep Learning.
site_url: https://gubscruz.github.io/ann-dl/
repo_url: https://github.com/gubscruz/ann-dl
repo_name: gubscruz/ann-dl
edit_uri: edit/main/docs/
use_directory_urls: true

theme:
  name: material
  language: pt-BR
  features:
    - content.code.copy
    - content.code.select
    - content.action.view
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight

nav:
  - Início: index.md
  - Exercícios:
      - Data: exercises/data/index.md
      - Perceptron: exercises/perceptron/index.md
      - MLP: exercises/mlp/index.md
      - VAE: exercises/vae/index.md
  - Projetos: projects/index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: pt
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      locale: pt
      timezone: America/Sao_Paulo
      fallback_to_build_date: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

copyright: gubscruz · Portfólio de Redes Neurais e Deep Learning
